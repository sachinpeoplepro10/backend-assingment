services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: taskapi-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./taskapi.db:/app/taskapi.db

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: taskapi-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped