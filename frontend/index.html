<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskAPI Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a3a;--accent:#7c6af7;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--text:#e8e8f0;--muted:#6b6b85;--radius:12px; }
    body { font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh; }
    .auth-page { min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% -20%,#1e1040 0%,transparent 70%),var(--bg); }
    .auth-box { width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:0 0 80px rgba(124,106,247,0.08);animation:slideUp 0.4s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }
    .auth-logo { font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:6px; }
    .auth-logo span { color:var(--accent); }
    .auth-sub { color:var(--muted);font-size:14px;margin-bottom:32px; }
    .tab-row { display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:28px; }
    .tab-btn { flex:1;padding:8px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s; }
    .tab-btn.active { background:var(--accent);color:white; }
    .field { margin-bottom:16px; }
    .field label { display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px; }
    .field input,.field select { width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;padding:10px 14px;outline:none;transition:border-color 0.2s; }
    .field input:focus,.field select:focus { border-color:var(--accent); }
    .field select option { background:var(--surface2); }
    .btn { width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:white;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.2s,transform 0.1s; }
    .btn:hover { opacity:0.9; } .btn:active { transform:scale(0.98); } .btn:disabled { opacity:0.5;cursor:not-allowed; }
    .btn-sm { width:auto;padding:6px 14px;font-size:13px;border-radius:7px; }
    .btn-ghost { background:transparent;border:1px solid var(--border);color:var(--muted); }
    .btn-ghost:hover { border-color:var(--accent);color:var(--accent); }
    .btn-danger { background:var(--red); }
    .msg { padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;font-family:'DM Mono',monospace; }
    .msg.error { background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:var(--red); }
    .msg.success { background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3);color:var(--green); }
    .dashboard { display:grid;grid-template-columns:220px 1fr;min-height:100vh; }
    .sidebar { background:var(--surface);border-right:1px solid var(--border);padding:28px 20px;display:flex;flex-direction:column;gap:4px; }
    .sidebar-logo { font-size:20px;font-weight:800;letter-spacing:-0.5px;padding:0 8px;margin-bottom:24px; }
    .sidebar-logo span { color:var(--accent); }
    .nav-item { display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;transition:all 0.15s;border:none;background:transparent;width:100%;text-align:left; }
    .nav-item:hover { background:var(--surface2);color:var(--text); }
    .nav-item.active { background:rgba(124,106,247,0.15);color:var(--accent); }
    .sidebar-bottom { margin-top:auto; }
    .user-chip { display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;margin-bottom:8px; }
    .avatar { width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0; }
    .user-name { font-size:13px;font-weight:600; }
    .user-role { font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase; }
    .main { padding:36px 40px;overflow-y:auto; }
    .page-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:32px; }
    .page-title { font-size:26px;font-weight:800;letter-spacing:-0.5px; }
    .page-sub { color:var(--muted);font-size:14px;margin-top:3px; }
    .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px; }
    .stat-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px; }
    .stat-value { font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1; }
    .stat-label { font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-top:6px;font-weight:600; }
    .filters { display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap; }
    .filter-btn { padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s; }
    .filter-btn.active,.filter-btn:hover { border-color:var(--accent);color:var(--accent);background:rgba(124,106,247,0.1); }
    .tasks-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px; }
    .task-card { background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:border-color 0.2s,transform 0.15s;animation:slideUp 0.3s ease; }
    .task-card:hover { border-color:var(--accent);transform:translateY(-2px); }
    .task-card-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px; }
    .task-title { font-size:15px;font-weight:700;line-height:1.3; }
    .task-title.done { text-decoration:line-through;color:var(--muted); }
    .task-desc { color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px;min-height:18px; }
    .task-footer { display:flex;justify-content:space-between;align-items:center; }
    .badges { display:flex;gap:6px; }
    .badge { padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em; }
    .badge-pending { background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.3); }
    .badge-in_progress { background:rgba(124,106,247,0.12);color:var(--accent);border:1px solid rgba(124,106,247,0.3); }
    .badge-done { background:rgba(74,222,128,0.12);color:var(--green);border:1px solid rgba(74,222,128,0.3); }
    .badge-high { background:rgba(247,106,140,0.12);color:#f76a8c;border:1px solid rgba(247,106,140,0.3); }
    .badge-medium { background:rgba(251,191,36,0.12);color:var(--yellow);border:1px solid rgba(251,191,36,0.3); }
    .badge-low { background:rgba(107,107,133,0.12);color:var(--muted);border:1px solid var(--border); }
    .task-actions { display:flex;gap:6px; }
    .modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    .modal { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:460px;max-width:90vw;animation:slideUp 0.25s ease; }
    .modal-title { font-size:20px;font-weight:800;margin-bottom:24px; }
    .modal-actions { display:flex;gap:10px;margin-top:24px; }
    .modal-actions .btn { flex:1; }
    .empty-state { text-align:center;padding:60px 20px;color:var(--muted); }
    .empty-icon { font-size:48px;margin-bottom:16px; }
    .spinner { width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }
    table { width:100%;border-collapse:collapse; }
    th { text-align:left;padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);border-bottom:1px solid var(--border); }
    td { padding:14px 16px;font-size:14px;border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = "https://backend-assingment-s3ik.onrender.com/api/v1";

const apiFetch = async (path, options = {}, token = null) => {
  const headers = { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) };
  const res = await fetch(`${API}${path}`, { headers, ...options });
  const data = res.status !== 204 ? await res.json() : null;
  if (!res.ok) throw new Error(data?.detail || "Request failed");
  return data;
};

function AuthPage({ onLogin }) {
  const [tab, setTab] = useState("login");
  const [form, setForm] = useState({ email:"", password:"", username:"", role:"user" });
  const [msg, setMsg] = useState(null);
  const [loading, setLoading] = useState(false);
  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  const submit = async () => {
    setMsg(null); setLoading(true);
    try {
      if (tab === "login") {
        const data = await apiFetch("/auth/login", { method:"POST", body:JSON.stringify({email:form.email,password:form.password}) });
        localStorage.setItem("token", data.access_token);
        onLogin(data.user, data.access_token);
      } else {
        await apiFetch("/auth/register", { method:"POST", body:JSON.stringify(form) });
        setMsg({ type:"success", text:"Account created! Please log in." });
        setTab("login");
      }
    } catch(e) { setMsg({ type:"error", text:e.message }); }
    finally { setLoading(false); }
  };

  return (
    <div className="auth-page">
      <div className="auth-box">
        <div className="auth-logo">Task<span>API</span></div>
        <div className="auth-sub">Scalable REST API with JWT + RBAC</div>
        <div className="tab-row">
          <button className={`tab-btn ${tab==="login"?"active":""}`} onClick={()=>setTab("login")}>Login</button>
          <button className={`tab-btn ${tab==="register"?"active":""}`} onClick={()=>setTab("register")}>Register</button>
        </div>
        {tab==="register" && <>
          <div className="field"><label>Username</label><input placeholder="john_doe" value={form.username} onChange={e=>set("username",e.target.value)} /></div>
          <div className="field"><label>Role</label><select value={form.role} onChange={e=>set("role",e.target.value)}><option value="user">User</option><option value="admin">Admin</option></select></div>
        </>}
        <div className="field"><label>Email</label><input type="email" placeholder="you@example.com" value={form.email} onChange={e=>set("email",e.target.value)} /></div>
        <div className="field"><label>Password</label><input type="password" placeholder="••••••••" value={form.password} onChange={e=>set("password",e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} /></div>
        <button className="btn" onClick={submit} disabled={loading}>{loading ? <span className="spinner"/> : tab==="login"?"Sign In":"Create Account"}</button>
        {msg && <div className={`msg ${msg.type}`}>{msg.text}</div>}
      </div>
    </div>
  );
}

function TaskModal({ task, onClose, onSave, token }) {
  const [form, setForm] = useState(task || { title:"", description:"", status:"pending", priority:"medium" });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async () => {
    setErr(null); setLoading(true);
    try {
      const result = task
        ? await apiFetch(`/tasks/${task.id}`, {method:"PATCH",body:JSON.stringify(form)}, token)
        : await apiFetch("/tasks/", {method:"POST",body:JSON.stringify(form)}, token);
      onSave(result, !!task);
    } catch(e) { setErr(e.message); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-title">{task?"Edit Task":"New Task"}</div>
        <div className="field"><label>Title</label><input placeholder="Task title" value={form.title} onChange={e=>set("title",e.target.value)} /></div>
        <div className="field"><label>Description</label><input placeholder="Optional" value={form.description||""} onChange={e=>set("description",e.target.value)} /></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div className="field"><label>Status</label><select value={form.status} onChange={e=>set("status",e.target.value)}><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="done">Done</option></select></div>
          <div className="field"><label>Priority</label><select value={form.priority} onChange={e=>set("priority",e.target.value)}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        </div>
        {err && <div className="msg error">{err}</div>}
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn" onClick={save} disabled={loading}>{loading?<span className="spinner"/>:task?"Save":"Create"}</button>
        </div>
      </div>
    </div>
  );
}

function TasksPage({ token }) {
  const [tasks, setTasks] = useState([]);
  const [filter, setFilter] = useState("all");
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const params = filter !== "all" ? `?status=${filter}` : "";
      setTasks(await apiFetch(`/tasks/${params}`, {}, token));
    } catch(e) { console.error(e); }
    finally { setLoading(false); }
  }, [token, filter]);

  useEffect(() => { load(); }, [load]);

  const deleteTask = async (id) => {
    if (!confirm("Delete this task?")) return;
    try { await apiFetch(`/tasks/${id}`, {method:"DELETE"}, token); setTasks(t=>t.filter(x=>x.id!==id)); }
    catch(e) { alert(e.message); }
  };

  const onSave = (task, isEdit) => {
    if (isEdit) setTasks(t=>t.map(x=>x.id===task.id?task:x));
    else setTasks(t=>[task,...t]);
    setModal(null);
  };

  const counts = { all:tasks.length, pending:tasks.filter(t=>t.status==="pending").length, in_progress:tasks.filter(t=>t.status==="in_progress").length, done:tasks.filter(t=>t.status==="done").length };

  return (
    <div className="main">
      <div className="page-header">
        <div><div className="page-title">Tasks</div><div className="page-sub">{counts.all} total · {counts.done} completed</div></div>
        <button className="btn btn-sm" onClick={()=>setModal("new")} style={{width:"auto",padding:"10px 20px"}}>+ New Task</button>
      </div>
      <div className="stats-row">
        {[["All",counts.all,"#e8e8f0"],["Pending",counts.pending,"#fbbf24"],["In Progress",counts.in_progress,"#7c6af7"],["Done",counts.done,"#4ade80"]].map(([label,val,color])=>(
          <div className="stat-card" key={label}><div className="stat-value" style={{color}}>{val}</div><div className="stat-label">{label}</div></div>
        ))}
      </div>
      <div className="filters">
        {["all","pending","in_progress","done"].map(f=>(
          <button key={f} className={`filter-btn ${filter===f?"active":""}`} onClick={()=>setFilter(f)}>
            {f==="all"?"All":f.replace("_"," ").replace(/\b\w/g,c=>c.toUpperCase())}
          </button>
        ))}
      </div>
      {loading ? <div style={{textAlign:"center",padding:60}}><span className="spinner" style={{width:32,height:32}}/></div>
      : tasks.length===0 ? <div className="empty-state"><div className="empty-icon">📋</div><h3>No tasks yet</h3><p>Create your first task</p></div>
      : <div className="tasks-grid">
          {tasks.map(task=>(
            <div className="task-card" key={task.id}>
              <div className="task-card-header"><div className={`task-title ${task.is_completed?"done":""}`}>{task.title}</div></div>
              {task.description && <div className="task-desc">{task.description}</div>}
              <div className="task-footer">
                <div className="badges">
                  <span className={`badge badge-${task.status}`}>{task.status.replace("_"," ")}</span>
                  <span className={`badge badge-${task.priority}`}>{task.priority}</span>
                </div>
                <div className="task-actions">
                  <button className="btn btn-sm btn-ghost" onClick={()=>setModal(task)}>Edit</button>
                  <button className="btn btn-sm btn-danger" style={{padding:"6px 10px"}} onClick={()=>deleteTask(task.id)}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>}
      {modal && <TaskModal task={modal==="new"?null:modal} onClose={()=>setModal(null)} onSave={onSave} token={token} />}
    </div>
  );
}

function AdminPage({ token }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    apiFetch("/admin/users", {}, token).then(setUsers).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }, []);

  const toggle = async (user) => {
    const path = user.is_active ? `/admin/users/${user.id}/deactivate` : `/admin/users/${user.id}/activate`;
    try { const u = await apiFetch(path, {method:"PATCH"}, token); setUsers(us=>us.map(x=>x.id===u.id?u:x)); }
    catch(e) { alert(e.message); }
  };

  return (
    <div className="main">
      <div className="page-header"><div><div className="page-title">User Management</div><div className="page-sub">Admin only · {users.length} users</div></div></div>
      {loading ? <div style={{textAlign:"center",padding:60}}><span className="spinner" style={{width:32,height:32}}/></div>
      : <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)"}}>
          <table>
            <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {users.map(u=>(
                <tr key={u.id}>
                  <td style={{color:"var(--muted)",fontFamily:"DM Mono"}}>#{u.id}</td>
                  <td style={{fontWeight:600}}>{u.username}</td>
                  <td style={{color:"var(--muted)",fontFamily:"DM Mono",fontSize:13}}>{u.email}</td>
                  <td><span className={`badge ${u.role==="admin"?"badge-high":"badge-low"}`}>{u.role}</span></td>
                  <td><span className={`badge ${u.is_active?"badge-done":"badge-pending"}`}>{u.is_active?"active":"inactive"}</span></td>
                  <td><button className="btn btn-sm btn-ghost" onClick={()=>toggle(u)}>{u.is_active?"Deactivate":"Activate"}</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [token, setToken] = useState(null);
  const [page, setPage] = useState("tasks");

  useEffect(() => {
    const t = localStorage.getItem("token");
    if (t) apiFetch("/auth/me", {}, t).then(u=>{setUser(u);setToken(t);}).catch(()=>localStorage.removeItem("token"));
  }, []);

  const onLogin = (u,t) => { setUser(u); setToken(t); };
  const logout = () => { localStorage.removeItem("token"); setUser(null); setToken(null); };

  if (!user) return <AuthPage onLogin={onLogin} />;

  return (
    <div className="dashboard">
      <aside className="sidebar">
        <div className="sidebar-logo">Task<span>API</span></div>
        <button className={`nav-item ${page==="tasks"?"active":""}`} onClick={()=>setPage("tasks")}>📋 Tasks</button>
        {user.role==="admin" && <button className={`nav-item ${page==="admin"?"active":""}`} onClick={()=>setPage("admin")}>👥 Users</button>}
        <a href="http://localhost:8000/docs" target="_blank" className="nav-item" style={{textDecoration:"none"}}>📖 API Docs</a>
        <div className="sidebar-bottom">
          <div className="user-chip">
            <div className="avatar">{user.username[0].toUpperCase()}</div>
            <div><div className="user-name">{user.username}</div><div className="user-role">{user.role}</div></div>
          </div>
          <button className="nav-item" onClick={logout} style={{color:"var(--red)"}}>→ Logout</button>
        </div>
      </aside>
      <main>
        {page==="tasks" && <TasksPage token={token} user={user} />}
        {page==="admin" && user.role==="admin" && <AdminPage token={token} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
